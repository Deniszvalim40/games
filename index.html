<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
:root{--bg:#0d1410;--fg:#eef3ea;--card:#16211a;--acc:#34c759}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:40px 16px;box-sizing:border-box}
h1{margin:0 0 24px;font-size:28px}
a.card{display:flex;align-items:center;gap:16px;width:min(420px,100%);padding:16px;border-radius:16px;background:var(--card);color:var(--fg);text-decoration:none;border:1px solid rgba(255,255,255,.08)}
a.card:hover{border-color:var(--acc)}
a.card img{width:64px;height:64px;border-radius:14px}
a.card b{display:block;font-size:18px}
a.card span{opacity:.7;font-size:14px}
a.card+a.card{margin-top:12px}
</style></head><body>
<h1>🎮 Games</h1>
<a class="card" href="aero-patrulha/"><img src="aero-patrulha/icon-192.png" alt=""><div><b>Aero Patrulha</b><span>Drone, bateria, chefes e Top 3</span></div></a>
<a class="card" href="trincheira/"><img src="trincheira/icon-192.png" alt=""><div><b>Trincheira</b><span>Soldados, trincheiras e 4 dificuldades</span></div></a>
<a class="card" href="vagalumia/"><img src="vagalumia/icon-192.png" alt=""><div><b>Vagalumia</b><span>Vaga-lumes, potes e imagens que acendem</span></div></a>
</body></html>
