<script>
// ===== Aero Patrulha — jogo original: drone, bateria, mapa aberto em rolagem vertical =====
const W=360,H=640,PY=H-130,CH=640,SL=3200,RS=2;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let scale=1;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  scale=Math.min(innerWidth/W,(innerHeight-(window.RANK_H||0))/H);
  cv.style.width=W*scale+'px';cv.style.height=H*scale+'px';
  cv.width=Math.round(W*scale*dpr);cv.height=Math.round(H*scale*dpr);
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
addEventListener('resize',resize);resize();

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- áudio ----------
let AC=null,hum=null;
function initAudio(){
  if(!AC){try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=110;f.type='lowpass';f.frequency.value=380;g.gain.value=0;
    o.connect(f).connect(g).connect(AC.destination);o.start();hum={o,g};
  }catch(e){}}
  else if(AC.state==='suspended')AC.resume();
}
function beep(f,d,type='square',v=.04,slide=0){
  if(!AC)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);
}
function noise(d,v=.2,freq=900){
  if(!AC)return;const t=AC.currentTime,n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  f.type='lowpass';f.frequency.value=freq;s.buffer=b;g.gain.value=v;
  s.connect(f).connect(g).connect(AC.destination);s.start(t);
}

// ---------- terreno procedural ----------
const roadX=wy=>W/2+95*Math.sin(wy/720)+38*Math.sin(wy/250+1.3);
const riverX=wy=>W/2+125*Math.sin(wy/980+2.1)+30*Math.sin(wy/340);
const FIELD=['#7c8a3e','#8f7d4a','#6b8a3a','#9a9152','#7a6a40'];
const ROOF=[['#b46c4c','#7a4430'],['#9a9da4','#5b5e64'],['#bba98e','#7d715e'],['#64778a','#3c4954'],['#a5503c','#6d3022']];
const TREE=[['#6f9a45','#24421a'],['#82a54e','#30501d'],['#5a8a3c','#1c3614'],['#7d9440','#3a4a1a']];
const itemCache=new Map(),chunks=new Map();
// ---------- fases: a cada 5 setores muda o bioma ----------
const PHASE_LEN=5;
const BIOMES=[
  {name:'CAMPO',base:'#56713b',speck:[78,30,28,18,20,17],patch:['rgba(125,140,62,.32)','rgba(30,60,25,.34)'],field:FIELD,fieldN:3.2,roof:ROOF,tree:TREE,treeN:1,treeR:1,flat:.3,
   bank:['#8f8a5e','#4d6a52'],water:['#2c5163','#33637a','rgba(140,190,210,.22)'],spark:'rgba(225,240,255,.28)',shoulder:'#a39c8a',asphalt:'#3c3d41',line:'#e2c044'},
  {name:'DESERTO',base:'#c8a46a',speck:[28,18,35,25,48,22],patch:['rgba(235,205,145,.4)','rgba(150,105,60,.3)'],field:['#b88f58','#d6b47c','#a97f4c'],fieldN:1.6,
   roof:[['#d2a273','#a8764a'],['#c4b59a','#94856c'],['#b98a5c','#8a5f3a']],tree:[['#8a9a5b','#4a5428'],['#a0a060','#5a5a2a']],treeN:.35,treeR:.6,flat:.75,
   bank:['#e0c890','#8fa060'],water:['#2f6f80','#3a8a9a','rgba(170,220,230,.25)'],spark:'rgba(230,250,255,.35)',shoulder:'#d1b88c',asphalt:'#4a4640',line:'#f0f0f0'},
  {name:'NEVE',base:'#e2e9ee',speck:[200,15,10,15,80,15],patch:['rgba(255,255,255,.55)','rgba(150,172,195,.3)'],field:['#d3dee6','#c4d2dc'],fieldN:1.5,
   roof:[['#f6f9fb','#cdd6dd'],['#eef2f5','#b9c4cc']],tree:[['#4f7a5c','#14281a'],['#5d8468','#1a3322']],treeN:1,treeR:1,flat:.2,
   bank:['#c9d6df','#9db4c2'],water:['#5d89a3','#7fa9c0','rgba(230,245,255,.4)'],spark:'rgba(255,255,255,.55)',shoulder:'#cfd6da',asphalt:'#5a5f63',line:'#f4d35e'},
  {name:'VULCÃO',base:'#3b3532',speck:[15,10,12,12,13,14],patch:['rgba(95,72,60,.4)','rgba(10,8,8,.45)'],field:['#2a2422','#4a3a33'],fieldN:1.2,
   roof:[['#5a524e','#38312e'],['#6b4a3a','#3f2a20']],tree:[['#4a4a3a','#1a1a14'],['#55432e','#22180f']],treeN:.5,treeR:.7,flat:.5,
   bank:['#2a1e1a','#7a2a10'],water:['#c2340f','#ff6a1a','rgba(255,220,120,.5)'],spark:'rgba(255,240,160,.7)',shoulder:'#5a5450',asphalt:'#262426',line:'#ff9a3a'},
];
const phaseOfSector=s=>Math.floor(Math.max(0,s)/PHASE_LEN);
const biomeOfK=k=>BIOMES[phaseOfSector(Math.floor(k*CH/SL))%BIOMES.length];

function avoid(it,x,wy,m){
  if(x<6||x>W-6)return true;
  if(Math.abs(x-roadX(wy))<18+m)return true;
  if(Math.abs(x-riverX(wy))<32+m)return true;
  if(it.cross!==null&&Math.abs(wy-it.cross)<12+m)return true;
  return false;
}
function items(k){
  let it=itemCache.get(k);if(it)return it;
  const R=rng(k*131+7),base=k*CH,B=biomeOfK(k);
  it={patch:[],field:[],cross:null,bld:[],tree:[]};
  for(let i=0;i<12;i++)it.patch.push({x:R()*W,wy:base+R()*CH,r:40+R()*90,c:R()<.5?B.patch[0]:B.patch[1]});
  const nf=Math.floor(R()*B.fieldN);
  for(let i=0;i<nf;i++)it.field.push({x:R()*W,wy:base+R()*CH,w:60+R()*90,h:50+R()*80,a:(R()-.5)*.5,c:B.field[Math.floor(R()*B.field.length)]});
  if(R()<.45)it.cross=base+60+R()*(CH-120);
  const nb=4+Math.floor(R()*10);
  for(let i=0,tries=0;i<nb&&tries<80;tries++){
    const wy=base+R()*CH,side=R()<.5?-1:1,x=roadX(wy)+side*(30+R()*80);
    const w=16+R()*22,h=14+R()*18;
    if(avoid(it,x,wy,Math.max(w,h)/2))continue;
    if(it.bld.some(b=>Math.abs(b.x-x)<(b.w+w)/2+3&&Math.abs(b.wy-wy)<(b.h+h)/2+3))continue;
    it.bld.push({x,wy,w,h,a:Math.atan((roadX(wy+1)-roadX(wy-1))/2),c:B.roof[Math.floor(R()*B.roof.length)],flat:R()<B.flat});i++;
  }
  const near=(x,wy,r)=>it.bld.some(b=>Math.abs(b.x-x)<b.w/2+r&&Math.abs(b.wy-wy)<b.h/2+r);
  const nc=Math.round((4+Math.floor(R()*6))*B.treeN);
  for(let c=0;c<nc;c++){
    const cx=R()*W,cy=base+R()*CH,n=6+Math.floor(R()*14),c0=Math.floor(R()*B.tree.length);
    for(let i=0;i<n;i++){
      const x=cx+(R()+R()-1)*36,wy=cy+(R()+R()-1)*36,r=(5+R()*7)*B.treeR;
      if(avoid(it,x,wy,r)||near(x,wy,r))continue;
      it.tree.push({x,wy,r,c:B.tree[R()<.75?c0:Math.floor(R()*B.tree.length)]});
    }
  }
  for(let i=0;i<22*B.treeN;i++){
    const x=R()*W,wy=base+R()*CH,r=(4+R()*6)*B.treeR;
    if(!avoid(it,x,wy,r)&&!near(x,wy,r))it.tree.push({x,wy,r,c:B.tree[Math.floor(R()*B.tree.length)]});
  }
  itemCache.set(k,it);return it;
}
const FRIENDS=['DAVI SACOMANI','DAVI SELMINE','MIGUEL','ARTHUR','JOÃO','NICOLAS','FERNANDO','LORENA','KURT'];
function chunk(k){
  let c=chunks.get(k);if(c)return c;
  c=document.createElement('canvas');c.width=W*RS;c.height=CH*RS;
  const g=c.getContext('2d');g.scale(RS,RS);
  const rank=(k+1)*CH,P=wy=>rank-wy,R=rng(k*977+5),its=[items(k-1),items(k),items(k+1)],B=biomeOfK(k),sp=B.speck;
  g.fillStyle=B.base;g.fillRect(0,0,W,CH);
  const PB=biomeOfK(k-1);if(PB!==B){const tg=g.createLinearGradient(0,CH,0,CH-260);tg.addColorStop(0,PB.base);tg.addColorStop(1,PB.base+'00');g.fillStyle=tg;g.fillRect(0,CH-260,W,260)}
  for(const it of its)for(const p of it.patch){
    const y=P(p.wy);if(y<-p.r||y>CH+p.r)continue;
    const gr=g.createRadialGradient(p.x,y,0,p.x,y,p.r);gr.addColorStop(0,p.c);gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.fillRect(p.x-p.r,y-p.r,p.r*2,p.r*2);
  }
  g.globalAlpha=.45;
  for(let i=0;i<1400;i++){g.fillStyle=`hsl(${sp[0]+R()*sp[1]},${sp[2]+R()*sp[3]}%,${sp[4]+R()*sp[5]}%)`;const s=1+R()*3.5;g.fillRect(R()*W,R()*CH,s,s)}
  g.globalAlpha=1;
  for(const it of its)for(const f of it.field){
    const y=P(f.wy);if(y<-150||y>CH+150)continue;
    g.save();g.translate(f.x,y);g.rotate(f.a);
    g.fillStyle=f.c;g.fillRect(-f.w/2,-f.h/2,f.w,f.h);
    g.beginPath();for(let s=-f.w/2+3;s<f.w/2;s+=5){g.moveTo(s,-f.h/2);g.lineTo(s,f.h/2)}
    g.strokeStyle='rgba(0,0,0,.13)';g.lineWidth=1.5;g.stroke();
    g.strokeStyle='rgba(50,40,20,.45)';g.lineWidth=1.5;g.strokeRect(-f.w/2,-f.h/2,f.w,f.h);
    g.restore();
  }
  const path=fx=>{g.beginPath();for(let py=-24;py<=CH+24;py+=6){const x=fx(rank-py);py===-24?g.moveTo(x,py):g.lineTo(x,py)}};
  g.lineCap='round';g.lineJoin='round';
  path(riverX);
  g.strokeStyle=B.bank[0];g.lineWidth=62;g.stroke();
  g.strokeStyle=B.bank[1];g.lineWidth=52;g.stroke();
  g.strokeStyle=B.water[0];g.lineWidth=46;g.stroke();
  g.strokeStyle=B.water[1];g.lineWidth=30;g.stroke();
  g.strokeStyle=B.water[2];g.lineWidth=10;g.stroke();
  for(let i=0;i<26;i++){const py=R()*CH,x=riverX(rank-py)+(R()-.5)*32;g.fillStyle=B.spark;g.fillRect(x,py,5+R()*9,1)}
  for(const it of its)if(it.cross!==null){
    const y=P(it.cross);if(y<-30||y>CH+30)continue;
    g.beginPath();g.moveTo(-10,y);g.lineTo(W+10,y);
    g.strokeStyle=B.shoulder;g.lineWidth=20;g.stroke();
    g.strokeStyle=B.asphalt;g.lineWidth=15;g.stroke();
    g.setLineDash([8,8]);g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.2;g.stroke();g.setLineDash([]);
  }
  path(roadX);
  g.strokeStyle=B.shoulder;g.lineWidth=30;g.stroke();
  g.strokeStyle=B.asphalt;g.lineWidth=24;g.stroke();
  g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=14;g.stroke();
  g.setLineDash([10,10]);g.lineDashOffset=-(((rank%20)+20)%20);g.strokeStyle=B.line;g.lineWidth=1.6;g.stroke();g.setLineDash([]);
  if(k>=0){ // nome de um amigo pintado na faixa direita
    const wy=k*CH+320,dx=(roadX(wy+1)-roadX(wy-1))/2;
    g.save();g.translate(roadX(wy),P(wy));g.rotate(Math.atan2(-1,dx));
    g.font='800 8px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.fillStyle='rgba(255,255,255,.3)';g.fillText(FRIENDS[k%FRIENDS.length],0,6);g.restore();
  }
  for(const it of its)for(const b of it.bld){
    const y=P(b.wy);if(y<-40||y>CH+40)continue;
    g.save();g.translate(b.x+5,y+7);g.rotate(b.a);g.fillStyle='rgba(0,0,0,.38)';g.fillRect(-b.w/2,-b.h/2,b.w,b.h);g.restore();
    g.save();g.translate(b.x,y);g.rotate(b.a);
    if(b.flat){
      g.fillStyle=b.c[0];g.fillRect(-b.w/2,-b.h/2,b.w,b.h);
      g.fillStyle='rgba(0,0,0,.15)';g.fillRect(-b.w/2+2,-b.h/2+2,b.w-4,b.h-4);
      g.fillStyle='#c9cbcc';g.fillRect(-3,-3,6,5);g.fillStyle='rgba(0,0,0,.4)';g.fillRect(-1,2,6,2);
    }else if(b.w>b.h){
      g.fillStyle=b.c[0];g.fillRect(-b.w/2,-b.h/2,b.w,b.h/2);g.fillStyle=b.c[1];g.fillRect(-b.w/2,0,b.w,b.h/2);
      g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=.8;g.beginPath();g.moveTo(-b.w/2,0);g.lineTo(b.w/2,0);g.stroke();
    }else{
      g.fillStyle=b.c[0];g.fillRect(-b.w/2,-b.h/2,b.w/2,b.h);g.fillStyle=b.c[1];g.fillRect(0,-b.h/2,b.w/2,b.h);
      g.strokeStyle='rgba(255,255,255,.22)';g.lineWidth=.8;g.beginPath();g.moveTo(0,-b.h/2);g.lineTo(0,b.h/2);g.stroke();
    }
    g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=.8;g.strokeRect(-b.w/2,-b.h/2,b.w,b.h);
    g.restore();
  }
  for(const it of its)for(const t of it.tree){
    const y=P(t.wy);if(y<-20||y>CH+20)continue;
    g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.arc(t.x+t.r*.5,y+t.r*.65,t.r,0,7);g.fill();
  }
  for(const it of its)for(const t of it.tree){
    const y=P(t.wy);if(y<-20||y>CH+20)continue;
    const gr=g.createRadialGradient(t.x-t.r*.35,y-t.r*.4,t.r*.1,t.x,y,t.r);
    gr.addColorStop(0,t.c[0]);gr.addColorStop(1,t.c[1]);
    g.fillStyle=gr;g.beginPath();g.arc(t.x,y,t.r,0,7);g.fill();
  }
  chunks.set(k,c);return c;
}
function scorch(x,wy,r){
  const k=Math.floor(wy/CH),c=chunks.get(k);if(!c)return;
  const g=c.getContext('2d'),y=(k+1)*CH-wy,gr=g.createRadialGradient(x,y,0,x,y,r);
  gr.addColorStop(0,'rgba(20,14,8,.75)');gr.addColorStop(.6,'rgba(30,22,12,.4)');gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
}

// ---------- nuvens e vinheta ----------
function makeCloud(seed,col){
  const c=document.createElement('canvas');c.width=300;c.height=180;const g=c.getContext('2d'),R=rng(seed*55+1);
  for(let i=0;i<18;i++){
    const x=70+R()*160,y=55+R()*70,r=25+R()*40,gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${col},.85)`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2);
  }
  return c;
}
const CLOUD=[0,1,2].map(i=>makeCloud(i,'255,255,255')),CSHADOW=[0,1,2].map(i=>makeCloud(i,'0,0,0'));
let clouds=[];
function resetClouds(){clouds=[];for(let i=0;i<4;i++)clouds.push({x:Math.random()*W-150,cy:i*260,i:i%3,s:.9+Math.random()*.7})}
const vign=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const gr=g.createRadialGradient(W/2,H*.45,H*.25,W/2,H*.5,H*.75);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.5)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  const lg=g.createLinearGradient(0,0,W,H);lg.addColorStop(0,'rgba(255,236,190,.10)');lg.addColorStop(.5,'rgba(255,236,190,0)');
  g.fillStyle=lg;g.fillRect(0,0,W,H);return c})();

// ---------- estado ----------
let ents=[],bullets=[],ebul=[],parts=[],pops=[],genS=new Set();
let scroll=0,px=W/2,speed=2.6,bat=100,score=0,lives=3,state='title',deadT=0,overT=0,fireT=0,hi=0,lowBeep=0,flash=0,chgT=0,sector=1,banner=0,inv=0,tilt=0,charging=false,T=0;
// habilidades compráveis + power-up do mapa
let up={tiro:0,bat:0,esc:0,melee:0},credits=0,phEarn=0,shield=0,over=0;
const CREDIT_RATE=.65; // créditos = 65% dos pontos de abates...
// ...com teto por fase: 2500, 3000, 4000, 5000 (5000 dali em diante)
const CREDIT_CAPS=[2500,3000,4000,5000];
const CREDIT_CAP=ph=>CREDIT_CAPS[Math.min(ph,CREDIT_CAPS.length-1)];
const wallet=()=>Math.floor(credits);
const PAD_BASE=15,PAD_BONUS=[0,3,6,11]; // recarga 15%; +3% / +3% / +5% por nível
const padGain=()=>PAD_BASE+PAD_BONUS[up.bat];
const SKILLS=[
  {k:'tiro',name:'MULTI-TIRO',icon:'✦',cost:[1500,3000,5000],desc:['3 tiros em leque','Cadência mais rápida','5 tiros em leque']},
  {k:'bat',name:'RECARGA TURBO',icon:'⚡',cost:[1000,2000,3500],desc:['Plataformas recarregam 18%','Plataformas recarregam 21%','Plataformas recarregam 26%']},
  {k:'melee',name:'HÉLICES CORTANTES',icon:'✂',cost:[1500,3000,4500],desc:['Bater destrói drones (-5% bateria)','Corta helicópteros também (-3%)','Alcance maior e sem gasto']},

function updateBoss(dt){
  const b=boss;b.t+=dt;if(b.hit>0)b.hit-=dt;
  if(b.dying>0){
    b.dying-=dt;
    if(Math.random()<.35*dt)explode(b.x+(Math.random()-.5)*b.w,scroll+H-(b.y+(Math.random()-.5)*b.h),1.3,false);
    if(b.dying<=0){
      explode(b.x,scroll+H-b.y,3.5,false);explode(b.x-40,scroll+H-b.y,2,false);explode(b.x+40,scroll+H-b.y,2,false);flash=16;

  if(b.ent>0){b.ent-=dt;b.y+=(165-b.y)*.035*dt;return}

  const shoot=(a,sp)=>ebul.push({x:b.x,y:wy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp});
  b.cool-=dt;if(b.cool>0)return;

function genSector(s){

    else if(p<.78)t=s>=1?'heli':'quad';else t=s>=2&&p<.9?'kami':'quad';

function update(dt){
  T+=dt;
  if(state==='shop'||state==='pause')return;
  if(state==='count'){const n=Math.ceil(countT/60);countT-=dt;
    if(countT<=0){state='play';inv=Math.max(inv,30);beep(1320,.2,'triangle',.05)}
    else if(Math.ceil(countT/60)<n)beep(880,.12,'triangle',.05);return}
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=p.k==='s'?.985:.93;p.vx*=Math.pow(f,dt);p.vy*=Math.pow(f,dt);if(p.k==='s')p.r+=.12*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0);

  for(const c of clouds){c.x+=.15*dt;if(H-(c.cy-scroll*1.5)>H+60){c.cy=scroll*1.5+H+80+Math.random()*250;c.x=Math.random()*W-160;c.i=Math.floor(Math.random()*3);c.s=.9+Math.random()*.7}}

    deadT-=dt;
    if(deadT<=0){
      if(lives>0){startSector(Math.max(0,Math.floor(pwy()/SL)));state='play'}
      else{
        state='over';overT=40;if(score>hi){hi=score;try{localStorage.setItem('ap_hi',hi)}catch(e){}}
        if(qualifies(score)){state='name';showName()}

  if(keys.ArrowLeft||keys.KeyA)dx-=1;if(keys.ArrowRight||keys.KeyD)dx+=1;

  genSector(cur);genSector(Math.floor((scroll+H+300)/SL));
  if(!boss&&isBossSec(cur)&&!bossDone.has(cur)&&pwy()>=cur*SL+SL*.55)startBoss(cur);

  fireT-=dt;
  if(fireT<=0&&(touch||keys.Space||mouse.down)){
    const y0=pwy()+10,lv=over>0?3:up.tiro;
    bullets.push({x:px-7,y:y0},{x:px+7,y:y0});
    if(lv>=1)bullets.push({x:px-9,y:y0,vx:-2.2},{x:px+9,y:y0,vx:2.2});
    if(lv>=3)bullets.push({x:px-10,y:y0,vx:-4.2},{x:px+10,y:y0,vx:4.2});

  for(const b of ebul){b.x+=b.vx*dt;b.y+=b.vy*dt;const s=sy(b.y);if(s>H+20||s<-20||b.x<-20||b.x>W+20)b.dead=true}

  for(const b of bullets){
    b.y+=13*dt;if(b.vx)b.x+=b.vx*dt;
    if(sy(b.y)<-10||b.x<-10||b.x>W+10){b.dead=true;continue}
    if(boss&&boss.ent<=0&&!boss.dying&&Math.abs(b.x-boss.x)<boss.w/2&&Math.abs(sy(b.y)-boss.y)<boss.h/2){
      b.dead=true;boss.hit=4;if(--boss.hp<=0){boss.dying=100;noise(1,.4,400)}else if(Math.random()<.3)beep(700,.03,'square',.015);continue}
    for(const e of ents){
      if(e.dead||!e.on||e.t==='core'||e.t==='pad')continue;
      if(Math.abs(b.x-e.x)<e.r+2&&Math.abs(b.y-e.y)<e.r+8){
        b.dead=true;e.hit=5;if(--e.hp<=0)kill(e,true);else beep(900,.03,'square',.02);break;
      }
    }
  }
  bullets=bullets.filter(b=>!b.dead);ebul=ebul.filter(b=>!b.dead);
  ents=ents.filter(e=>!e.dead&&sy(e.y)<H+60);

  // jogador
  const wy=pwy();charging=Math.max(0,charging-dt);
  for(const e of ents){
    if(!e.on)continue;
    const d=Math.hypot(px-e.x,wy-e.y);
    if(e.t==='pad'){if(!e.used&&d<28){e.used=true;const g=padGain();bat=Math.min(100,bat+g);charging=45;pops.push({x:e.x,y:e.y,txt:'+'+g+'% ⚡',life:60});beep(660,.1,'triangle',.05);beep(990,.18,'triangle',.045)}}
    else if(e.t==='drain'){if(!e.used&&!e.dead&&d<28){e.used=true;if(over<=0){bat=Math.max(0,bat-DRAIN);pops.push({x:e.x,y:e.y,txt:'-'+DRAIN+'% ⚡',life:60});beep(300,.15,'sawtooth',.045,120);flash=4}}}
    else if(e.t==='core'){if(!e.dead&&d<26){e.dead=true;over=OVER_T;pops.push({x:e.x,y:e.y,txt:'SOBRECARGA 5s!',life:70});beep(520,.1,'sawtooth',.04,1040);beep(1040,.25,'triangle',.05,1560)}}
    else if(AIR[e.t]&&d<e.r+11+MELEE_R(up.melee)&&!e.dead){
      if(over>0){kill(e,true);continue}
      if(up.melee&&(e.t!=='heli'||up.melee>=2)){kill(e,true);bat=Math.max(1,bat-MELEE_COST[up.melee]);beep(1200,.06,'sawtooth',.03,300);continue}
      if(d>=e.r+11||inv>0)continue;
      if(shield>0){kill(e,true);shieldHit();continue}
      kill(e,false);return die()}
  }
  if(inv<=0)for(const b of ebul)if(Math.hypot(b.x-px,b.y-wy)<(over>0?18:10)){b.dead=true;if(over>0)continue;if(shield>0){shieldHit();continue}return die()}
  if(bat<25){lowBeep-=dt;if(lowBeep<=0){beep(200,.12,'square',.035);lowBeep=30}}
  if(bat<=0){bat=0;return die()}
}

function rotor(x,y,r,t,shadow){

}
function quadBody(s,col,led,t,shadow,blink){

const PLAYER_COL=['#f4f6f8','#9aa3ad','#d7dbe0'],ENEMY_COL=['#4a4f57','#1a1d21','#2c3035'],KAMI_COL=['#c2402e','#4a0f0a','#3a1410'];

  for(const e of ents){const y=sy(e.y);if(y<-40||y>H+40)continue;
    if(e.t==='quad')drawDrone(e.x,y,.85,Math.PI+Math.sin(e.ph)*.15,e.hit>0?['#fff','#ccc','#ddd']:ENEMY_COL,['#ff3b30','#ff3b30'],false);
    else if(e.t==='kami')drawDrone(e.x,y,.72,Math.PI,KAMI_COL,['#ffcc00','#ff3b30'],true);
    else if(e.t==='heli')drawHeli(e,y);
    else if(e.t==='core')drawCore(e,y);
  }
  if(boss)drawBoss();
  // balas inimigas
  for(const b of ebul){const y=sy(b.y);
    ctx.fillStyle='rgba(255,90,40,.25)';ctx.beginPath();ctx.arc(b.x,y,6,0,7);ctx.fill();
    ctx.fillStyle='#ffb070';ctx.beginPath();ctx.arc(b.x,y,2.6,0,7);ctx.fill()}
  // balas do jogador
  ctx.lineCap='round';
  ctx.beginPath();for(const b of bullets){const y=sy(b.y);ctx.moveTo(b.x,y);ctx.lineTo(b.x-(b.vx||0)*.9,y-12)}
  ctx.strokeStyle='rgba(255,200,80,.35)';ctx.lineWidth=4;ctx.stroke();ctx.strokeStyle='#fff6d0';ctx.lineWidth=1.6;ctx.stroke();

  if(state==='play'||state==='shop'||state==='pause'||state==='count'){
    if(over>0){const a=.35+.25*Math.sin(T*.4);ctx.globalCompositeOperation='lighter';
      const gr=ctx.createRadialGradient(px,PY,4,px,PY,34);gr.addColorStop(0,`rgba(255,210,80,${a})`);gr.addColorStop(1,'rgba(255,120,0,0)');
      ctx.fillStyle=gr;ctx.beginPath();ctx.arc(px,PY,34,0,7);ctx.fill();ctx.globalCompositeOperation='source-over'}
    if(!(inv>0&&over<=0&&Math.floor(T/5)%2))drawDrone(px,PY,1.15,tilt*.35,over>0?['#fff4c2','#e0a020','#f3d27a']:PLAYER_COL,['#34c759','#ff3b30'],false,1.1);
    if(up.melee){const rr=22+MELEE_R(up.melee);ctx.save();ctx.translate(px,PY);ctx.rotate(T*.3);
      ctx.strokeStyle=up.melee>=2?'rgba(255,120,90,.55)':'rgba(255,200,120,.45)';ctx.lineWidth=2;ctx.setLineDash([5,7]);
      ctx.beginPath();ctx.arc(0,0,rr,0,7);ctx.stroke();ctx.setLineDash([]);ctx.restore()}
    if(shield>0){ctx.strokeStyle=`rgba(110,200,255,${.45+.2*Math.sin(T*.15)})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(px,PY,26,0,7);ctx.stroke();
      ctx.fillStyle='rgba(110,200,255,.08)';ctx.fill()}
  }

  // fogo e destroços
  ctx.globalCompositeOperation='lighter';
  for(const p of parts)if(p.k==='f'){const q=p.life/p.max;ctx.fillStyle=`rgba(255,${Math.floor(90+160*q)},${Math.floor(40*q)},${Math.min(1,q*1.6)})`;ctx.beginPath();ctx.arc(p.x,sy(p.y),p.r*(.5+q),0,7);ctx.fill()}
  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='#1b1a18';for(const p of parts)if(p.k==='d')ctx.fillRect(p.x-1,sy(p.y)-1,2.5,2.5);

  // nuvens
  for(const c of clouds){const y=H-(c.cy-scroll*1.5);ctx.globalAlpha=.32;ctx.drawImage(CLOUD[c.i],c.x,y,300*c.s,180*c.s)}
  ctx.globalAlpha=1;
  for(const p of pops){ctx.globalAlpha=Math.min(1,p.life/25);txt(p.txt,p.x,sy(p.y),12,'#ffe27a')}
  ctx.globalAlpha=1;
  ctx.drawImage(vign,0,0,W,H);
  if(flash>0){ctx.fillStyle=`rgba(255,240,220,${flash/25})`;ctx.fillRect(0,0,W,H)}

  if(state==='title'){
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgba(8,12,10,.55)');g.addColorStop(.5,'rgba(8,12,10,.8)');g.addColorStop(1,'rgba(8,12,10,.55)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    drawDrone(W/2,140,2,Math.sin(T*.02)*.1,PLAYER_COL,['#34c759','#ff3b30'],false,1.6);
    txt('AERO',W/2,232,46,'#f4f6f8','center',800);txt('PATRULHA',W/2,276,30,'#7fd18b','center',700);
    const L=[['Celular','arraste o dedo · tiro automático'],['','arraste p/ cima acelera, p/ baixo freia'],['Mouse','mova p/ pilotar · segure o botão p/ atirar'],['','cursor acima do drone acelera'],['Teclado','← → ↑ ↓ e ESPAÇO']];
    L.forEach((l,k)=>{if(l[0])txt(l[0],38,328+k*22,12,'#7fd18b','left',700);txt(l[1],110,328+k*22,12,'#e6ece4','left',400)});
    txt('Recarregue nas bases ⚡ · pegue o núcleo dourado',W/2,452,12,'#ffe27a','center',500);txt('A cada fase: loja de habilidades com seus pontos',W/2,472,11,'#c9d1c6','center',400);
    if(Math.floor(T/30)%2)txt('TOQUE OU CLIQUE PARA COMEÇAR',W/2,500,15,'#ffffff','center',700);
    drawTop(548);
    return;
  }

  // HUD
  const tg=ctx.createLinearGradient(0,0,0,64);tg.addColorStop(0,'rgba(0,0,0,.55)');tg.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tg;ctx.fillRect(0,0,W,64);
  txt(String(score).padStart(6,'0'),14,30,20,'#ffffff','left',800);
  txt('FASE '+(phaseOfSector(sector-1)+1)+' · SETOR '+sector,W-14,26,12,'#7fd18b','right',700);
  txt('REC '+hi,W-14,42,11,'#c9d1c6','right',400);
  txt('CRÉDITOS '+wallet(),14,47,11,'#ffe27a','left',600);
  if(over>0){const w=120*over/OVER_T;ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(W/2-60,74,120,8);ctx.fillStyle='#ffc43a';ctx.fillRect(W/2-60,74,w,8);
    txt('SOBRECARGA '+Math.ceil(over/60)+'s',W/2,68,11,'#ffe27a','center',800)}
  if(shield>0)txt('◈'.repeat(shield),W-14,H-22,14,'#6ec8ff','right',800);
  const bg=ctx.createLinearGradient(0,H-70,0,H);bg.addColorStop(0,'rgba(0,0,0,0)');bg.addColorStop(1,'rgba(0,0,0,.6)');
  ctx.fillStyle=bg;ctx.fillRect(0,H-70,W,70);
  // vidas + bateria: coluna compacta e translúcida no topo à esquerda
  {const nl=Math.min(lives,5),LS=16,top=58,bw=12,bh=96,bx=10,by=top+nl*LS+18,cx=bx+bw/2;
  const bc=bat<25?(Math.floor(T/12)%2?'#ff453a':'#ff9f0a'):bat<50?'#ffd60a':'#34c759';
  ctx.globalAlpha=bat<25||charging?.9:.6;
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(bx-4,top,bw+8,by+bh+20-top);
  for(let k=0;k<nl;k++){ctx.save();ctx.translate(cx,top+9+k*LS);quadBody(.36,PLAYER_COL,['#34c759','#ff3b30'],T,false);ctx.restore()}
  ctx.strokeStyle='rgba(255,255,255,.8)';ctx.lineWidth=1.2;ctx.strokeRect(bx,by,bw,bh);
  ctx.fillStyle='rgba(255,255,255,.8)';ctx.fillRect(bx+3,by-3,6,2);
  const seg=Math.ceil(bat/10),sh=(bh-4)/10;
  for(let i=0;i<10;i++){ctx.fillStyle=i<seg?bc:'rgba(255,255,255,.08)';ctx.fillRect(bx+2,by+bh-2-(i+1)*sh+1,bw-4,sh-2)}
  txt('⚡',cx,by-8,charging?12:10,charging?(Math.floor(T/6)%2?'#34c759':'#b6ffc8'):bat<25?bc:'#c9d1c6','center',800);
  txt(Math.ceil(bat)+'%',cx+1,by+bh+13,9,charging?'#34c759':bc,'center',800);
  ctx.globalAlpha=1}
  if(banner>0){ctx.globalAlpha=Math.min(1,banner/30);
    if((sector-1)%PHASE_LEN===0){const ph=phaseOfSector(sector-1);ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,H*.31-44,W,H*.12+70);txt('FASE '+(ph+1),W/2,H*.31,40,'#ffe27a','center',900);txt(BIOMES[ph%BIOMES.length].name,W/2,H*.31+30,16,'#ffffff','center',700)}
    txt('SETOR '+sector,W/2,H*.43,26,'#ffffff','center',800);ctx.globalAlpha=1}

  if(boss&&state!=='title'){
    const w=230,x=W/2-w/2,y=100,name=BOSS_NAMES[boss.ph%BOSS_NAMES.length];
    txt('BOSS · '+name,W/2,y-7,11,'#ffcfc4','center',800);
    ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-2,y-2,w+4,12);
    ctx.fillStyle=boss.hp<boss.max/2?'#ff453a':'#ff9f0a';ctx.fillRect(x,y,w*Math.max(0,boss.hp)/boss.max,8);
  }
  if(bossWarn>0&&boss){ctx.globalAlpha=Math.min(1,bossWarn/30)*(Math.floor(T/8)%2?1:.6);
    ctx.fillStyle='rgba(120,0,0,.35)';ctx.fillRect(0,H*.36,W,90);
    txt('⚠ ALERTA DE BOSS ⚠',W/2,H*.36+38,24,'#ff6b5a','center',900);
    txt(BOSS_NAMES[boss.ph%BOSS_NAMES.length],W/2,H*.36+66,15,'#ffffff','center',800);ctx.globalAlpha=1}
  if(state==='play'){ // botão de pausa
    const b=PBTN;ctx.globalAlpha=.75;ctx.fillStyle='rgba(0,0,0,.4)';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.4;ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(b.x-5,b.y-6,3.5,12);ctx.fillRect(b.x+1.5,b.y-6,3.5,12);ctx.globalAlpha=1}
  if(state==='pause'){
    ctx.fillStyle='rgba(8,12,10,.72)';ctx.fillRect(0,0,W,H);
    txt('PAUSADO',W/2,H/2-60,36,'#ffffff','center',900);
    txt('FASE '+(phaseOfSector(sector-1)+1)+' · SETOR '+sector+' · '+score+' pts',W/2,H/2-28,12,'#c9d1c6','center',600);
    const r=RESUME;ctx.fillStyle='#34c759';ctx.beginPath();ctx.roundRect(r.x,r.y,r.w,r.h,12);ctx.fill();
    txt('▶ CONTINUAR',W/2,r.y+32,17,'#0b1a0f','center',900);
    txt('ou pressione P / Esc',W/2,r.y+r.h+24,11,'#9aa49a','center',500);
  }
  if(state==='count'){
    const n=Math.ceil(countT/60),f=(countT%60)/60;
    ctx.fillStyle='rgba(8,12,10,.35)';ctx.fillRect(0,0,W,H);
    ctx.globalAlpha=Math.min(1,f*2.2);
    txt(String(n),W/2,H/2+30,90+40*(1-f),'#ffe27a','center',900);
    ctx.globalAlpha=1;txt('PREPARE-SE',W/2,H/2+80,13,'#ffffff','center',800);
  }
  if(state==='shop')drawShop();
  if(state==='name'){
    ctx.fillStyle='rgba(8,12,10,.8)';ctx.fillRect(0,0,W,H);
    txt('NOVO RECORDE!',W/2,200,30,'#ffe27a','center',800);
    txt(score+' PONTOS',W/2,240,20,'#ffffff');
    txt('Você entrou no TOP 3. Digite seu nome:',W/2,290,13,'#c9d1c6','center',400);
  }
  if(state==='over'){
    ctx.fillStyle='rgba(8,12,10,.75)';ctx.fillRect(0,0,W,H);
    txt('MISSÃO ENCERRADA',W/2,200,26,'#ff6b5a','center',800);
    txt('PONTOS '+score,W/2,245,20,'#ffffff');
    drawTop(300);
    if(overT<=0&&Math.floor(T/30)%2)txt('TOQUE OU CLIQUE PARA JOGAR',W/2,470,15,'#7fd18b');
  }
}
function drawTop(y){
  const MED=['#ffd54a','#d7dde4','#d8935a'];
  txt('🏆 TOP 3',W/2,y,14,'#ffe27a','center',800);
  if(!rank.length){txt('Ninguém ainda — seja o primeiro!',W/2,y+26,12,'#c9d1c6','center',400);return}
  ctx.fillStyle='rgba(255,255,255,.07)';ctx.fillRect(W/2-120,y+10,240,rank.length*24+8);
  rank.forEach((r,k)=>{
    const ry=y+30+k*24;
    txt((k+1)+'º',W/2-104,ry,14,MED[k],'left',800);
    txt(r.name,W/2-74,ry,14,'#ffffff','left',600);
    txt(String(r.score),W/2+108,ry,14,MED[k],'right',800);
  });
}

let last=performance.now();
function loop(t){
  const dt=Math.min((t-last)/16.667,3);last=t;
  update(dt);draw();requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange',()=>{last=performance.now();if(document.hidden)pauseGame()});
resetClouds();
requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
if(window.Ranking)Ranking.init({game:'Aero Patrulha',col:'rank_aero',prefix:'AP',score:()=>hi,fmt:n=>n+' pts',onOpen:()=>pauseGame()});
</script>
</body>
</html>
